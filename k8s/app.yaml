# Local demonstration deployment; see docs/DEPLOYMENT.md.
# Stateful SQLite storage requires a single replica and Recreate updates.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rl-chat-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rl-chat
  labels:
    app: rl-chat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rl-chat
  template:
    metadata:
      labels:
        app: rl-chat
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rl-chat
          image: rl-chat:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_PATH
              value: /data/rl-chat.db
            - name: GEMINI_MODEL
              value: gemini-3-flash-preview
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rl-chat-secrets
                  key: GEMINI_API_KEY
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rl-chat-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rl-chat
spec:
  type: ClusterIP
  selector:
    app: rl-chat
  ports:
    - name: http
      port: 80
      targetPort: http
